<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of CV's</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <!-- Header -->
        <div class="card mb-4 shadow-sm">
            <div class="card-body text-center">
                <h1 class="card-title">📄 CV Library</h1>
                <p class="text-muted">Total CVs: {{ all_profiles|length }}</p>
            </div>
        </div>

        <!-- CV List -->
        <div class="row">
            {% for profile in all_profiles %}
            <div class="col-md-6 col-lg-4 mb-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <!-- Profile Name -->
                        <h5 class="card-title">{{ profile.name }}</h5>
                        
                        <!-- Optional: Add more profile details -->
                        {% if profile.email %}
                        <p class="card-text text-muted small mb-1">
                            <strong>Email:</strong> {{ profile.email }}
                        </p>
                        {% endif %}
                        
                        
                    </div>
                    
                    <!-- Download Button -->
                    <div class="card-footer bg-white border-top-0">
                        <a href="{% url 'resume' profile.id %}" class="btn btn-primary w-100">
                            📥 Download CV
                        </a>
                    </div>
                </div>
            </div>
            
            {% empty %}
            <!-- Empty State -->
            <div class="col-12">
                <div class="alert alert-info text-center">
                    <h4>No CVs found</h4>
                    <p>There are no profiles in the database yet.</p>
                </div>
            </div>
            {% endfor %}
        </div>

        <!-- Optional: Add a back button if needed -->
        <div class="mt-4 text-center">
            <a href="/" class="btn btn-outline-secondary">
                ← Back to Home
            </a>
        </div>
    </div>

    <!-- Bootstrap JS (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
